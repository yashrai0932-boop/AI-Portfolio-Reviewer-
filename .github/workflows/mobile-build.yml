name: Build Mobile App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'portfoliq/package-lock.json'

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Frontend Dependencies
      working-directory: ./portfoliq
      run: npm ci

    - name: Build Next.js Static Export
      working-directory: ./portfoliq
      run: npm run build

    - name: Sync Capacitor Android
      working-directory: ./portfoliq
      run: npx cap sync android

    - name: Build Android APK
      working-directory: ./portfoliq/android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: portfoliq/android/app/build/outputs/apk/debug/app-debug.apk
